spring.application.name=fasttrack-backend

# ---- Datasource (Postgres, e.g. Neon) ----
# Set these via environment variables in production (Render dashboard).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon (and most managed Postgres) requires SSL - handled via ?sslmode=require in the URL

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- File upload (accrual sheets: CSV / TXT / Excel) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- JWT ----
# Set APP_JWT_SECRET as a long random string (32+ chars) via environment variable
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-hours=${APP_JWT_EXPIRATION_HOURS:24}

# ---- Admin credentials ----
# APP_ADMIN_PASSWORD_HASH must be a BCrypt hash, never the plain password.
# Generate one using the helper described in the README.
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password-hash=${APP_ADMIN_PASSWORD_HASH}

# ---- Field-level encryption (PII: phone, email, address) ----
# Must be a Base64-encoded 32-byte (256-bit) key. Generate one with: openssl rand -base64 32
# Losing this key permanently destroys access to all encrypted PII - store it securely
# (e.g. a password manager), separately from database backups.
app.encryption.key=${APP_ENCRYPTION_KEY}

# ---- CORS ----
# Comma-separated list of allowed frontend origins, e.g. https://karma-yuva-points.vercel.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Used to build the shareable campaign form link (e.g. https://your-app.vercel.app)
app.frontend.base-url=${APP_FRONTEND_BASE_URL}

server.port=${PORT:8080}

# Only expose the health endpoint publicly - used by Render's health check
management.endpoints.web.exposure.include=health
