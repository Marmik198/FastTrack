# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Uses an in-memory H2 database so you can run the backend locally with zero setup.

spring.datasource.url=jdbc:h2:mem:karmayuva;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Hibernate 6.5+ generates "INSERT ... RETURNING id" for identity columns by default,
# which this H2 version's SQL parser rejects ("Syntax error ... returning id"). This
# falls back to the older getGeneratedKeys() approach, which H2 handles correctly.
# Not needed against Postgres in production - RETURNING works fine there.
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev-only defaults - DO NOT use these in production
app.jwt.secret=dev-only-secret-key-change-me-please-32chars-min
app.jwt.expiration-hours=24
app.admin.username=admin
# BCrypt hash of "admin123" - dev-only password, change for real use
app.admin.password-hash=$2b$12$0XQAiIUL1Ju.1eQUQKN2juWmIOEQcREWr/xZUjMpKqUXmrEj8gkGa

# Dev-only AES-256 key for encrypting phone/email/address at rest - DO NOT reuse in production
app.encryption.key=ryqDZEPiQTe2eHHXSaISpZVh4XacMzN0B+Wyn2wLlK4=

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.frontend.base-url=http://localhost:5173